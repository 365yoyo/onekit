[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "onekit"
version = "0.0.1"
description = "Compile a portable AI toolkit Kit for supported clients"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7"]

[project.scripts]
onekit = "core.cli:main"

[tool.setuptools]
packages = ["core", "writers"]
